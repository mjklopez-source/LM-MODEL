<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Flujo de automatizacion n8n</title>
  <desc id="desc">Flujo con nodos de inicio, solicitud HTTP, agente de IA y respuesta final.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102c52"/>
      <stop offset="1" stop-color="#1c5b91"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#07182e" flood-opacity="0.3"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#9cd5ff"/>
    </marker>
  </defs>

  <rect width="900" height="560" rx="24" fill="url(#background)"/>
  <path d="M0 110 C190 30 310 190 480 105 S740 50 900 120" fill="none" stroke="#4ca8df" stroke-opacity="0.22" stroke-width="3"/>
  <path d="M0 445 C210 350 310 510 505 410 S750 350 900 430" fill="none" stroke="#8ed2ff" stroke-opacity="0.16" stroke-width="4"/>

  <text x="54" y="70" fill="#dff2ff" font-family="Arial, sans-serif" font-size="22" font-weight="700">Flujo n8n</text>
  <text x="54" y="96" fill="#a9d4f1" font-family="Arial, sans-serif" font-size="14">Automatizacion de una solicitud con IA</text>

  <g fill="none" stroke="#9cd5ff" stroke-width="4" marker-end="url(#arrow)">
    <path d="M190 282 H262"/>
    <path d="M400 282 H472"/>
    <path d="M610 282 H682"/>
  </g>

  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <g transform="translate(54 220)">
      <rect width="136" height="124" rx="14" fill="#f8fbff"/>
      <circle cx="34" cy="35" r="16" fill="#26a269"/>
      <path d="M34 25 V45 M24 35 H44" stroke="#fff" stroke-width="3"/>
      <text x="20" y="78" fill="#18324d" font-size="16" font-weight="700">Inicio</text>
      <text x="20" y="100" fill="#60758a" font-size="12">Disparador</text>
    </g>

    <g transform="translate(264 220)">
      <rect width="136" height="124" rx="14" fill="#f8fbff"/>
      <circle cx="34" cy="35" r="16" fill="#f08c46"/>
      <path d="M25 35 H43 M34 26 V44" stroke="#fff" stroke-width="3"/>
      <text x="20" y="78" fill="#18324d" font-size="16" font-weight="700">HTTP</text>
      <text x="20" y="100" fill="#60758a" font-size="12">Recibir datos</text>
    </g>

    <g transform="translate(474 220)">
      <rect width="136" height="124" rx="14" fill="#f8fbff"/>
      <circle cx="34" cy="35" r="16" fill="#7b61ff"/>
      <path d="M26 34 C29 27 39 27 42 34 C39 42 29 42 26 34Z" fill="none" stroke="#fff" stroke-width="2"/>
      <text x="20" y="78" fill="#18324d" font-size="16" font-weight="700">Agente IA</text>
      <text x="20" y="100" fill="#60758a" font-size="12">Procesar texto</text>
    </g>

    <g transform="translate(684 220)">
      <rect width="136" height="124" rx="14" fill="#f8fbff"/>
      <circle cx="34" cy="35" r="16" fill="#2878c8"/>
      <path d="M25 35 H43 M36 28 L43 35 L36 42" fill="none" stroke="#fff" stroke-width="3"/>
      <text x="20" y="78" fill="#18324d" font-size="16" font-weight="700">Salida</text>
      <text x="20" y="100" fill="#60758a" font-size="12">Respuesta final</text>
    </g>
  </g>
</svg>
