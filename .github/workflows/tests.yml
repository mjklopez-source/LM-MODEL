# Ejecuta los tests de quantum_llm en cada push y pull request.
# Solo instala las dependencias que usan los tests (sin torch/qiskit) para que sea rápido.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:  # permite lanzarlo a mano desde la pestaña Actions

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install numpy pyyaml pydantic pydantic-settings pytest pytest-cov
          pip install -e . --no-deps

      - name: Ejecutar tests
        run: pytest --cov-report=term
