[pytest]
# Pytest configuration for QuantumLLM

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Coverage options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=src/quantum_llm
    --cov-report=html
    --cov-report=term-missing
    --cov-report=json

# Markers for test categorization
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    quantum: marks tests that require quantum simulator
    integration: marks tests as integration tests
    unit: marks tests as unit tests
